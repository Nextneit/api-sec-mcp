[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-sec-mcp"
version = "0.1.0"
description = "Security gateway between an LLM agent and an HTTP target, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
]

[project.scripts]
api-sec-mcp = "api_sec_mcp.server:main"
api-sec-verify = "api_sec_mcp.audit.logger:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_sec_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101", "S105", "S106", "E501"]
"src/api_sec_mcp/tools/*" = ["E501"]
"src/api_sec_mcp/egress/*" = ["E501"]
"src/api_sec_mcp/server.py" = ["ANN401"]
